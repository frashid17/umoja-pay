openapi: 3.0.3
info:
  title: Umoja Pay Payments API
  version: 1.0.0
  description: |
    East Africa payment aggregator API for Umoja Pay.
    Authenticate with `Authorization: Bearer uk_test_…` or `uk_live_…`.
    Amounts are in minor units (e.g. 1000 = 10.00 KES).

    ## Sandbox testing
    - M-Pesa: phone numbers ending in `0` fail; others succeed.
    - Card: last4 `4000`/`0000` declines; otherwise succeeds (e.g. `4242`).
    - Override with header `X-Umoja-Sandbox-Outcome: succeeded|failed`.
    - Hosted checkout: `/checkout/{session_id}` with merchant branding.
servers:
  - url: /api/v1
    description: Current deployment
tags:
  - name: Payments
  - name: Refunds
paths:
  /payments:
    post:
      tags: [Payments]
      summary: Create a payment
      operationId: createPayment
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: Prevents duplicate charges for the same key per merchant
        - in: header
          name: X-Umoja-Sandbox-Outcome
          schema:
            type: string
            enum: [succeeded, failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            example:
              amount: 15000
              currency: KES
              method: mpesa_stk
              phone: "254712345678"
              reference: order_123
              metadata:
                order_id: "123"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    get:
      tags: [Payments]
      summary: List payments
      operationId: listPayments
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: starting_after
          schema:
            type: string
          description: Payment ID cursor
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
                  has_more:
                    type: boolean
  /payments/{id}:
    get:
      tags: [Payments]
      summary: Retrieve a payment
      operationId: getPayment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          $ref: "#/components/responses/Error"
  /refunds:
    post:
      tags: [Refunds]
      summary: Create a full or partial refund
      operationId: createRefund
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Umoja-Sandbox-Outcome
          schema:
            type: string
            enum: [succeeded, failed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
            example:
              payment_id: "00000000-0000-0000-0000-000000000000"
              amount: 5000
              reason: Customer requested
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    get:
      tags: [Refunds]
      summary: List refunds
      operationId: listRefunds
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Refund list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Refund"
                  has_more:
                    type: boolean
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key `uk_test_…` or `uk_live_…`
  schemas:
    CreatePaymentRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          enum: [KES, TZS, UGX, RWF]
        method:
          type: string
          enum: [mpesa_stk, card]
          default: mpesa_stk
        phone:
          type: string
          description: MSISDN required for mpesa_stk, e.g. 254712345678
        card_last4:
          type: string
          minLength: 4
          maxLength: 4
          description: Last 4 digits for card API charges (prefer hosted checkout for full PAN)
        reference:
          type: string
        metadata:
          type: object
          additionalProperties: true
        callback_url:
          type: string
          format: uri
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
        currency:
          type: string
        method:
          type: string
        phone:
          type: string
        status:
          type: string
          enum:
            [
              pending,
              processing,
              succeeded,
              failed,
              canceled,
              partially_refunded,
              refunded,
            ]
        reference:
          type: string
          nullable: true
        metadata:
          type: object
        mode:
          type: string
          enum: [test, live]
        provider_ref:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateRefundRequest:
      type: object
      required: [payment_id, amount]
      properties:
        payment_id:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
          description: Minor units to refund (full or partial)
        reason:
          type: string
          maxLength: 500
    Refund:
      type: object
      properties:
        id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        amount:
          type: integer
        currency:
          type: string
        method:
          type: string
          enum: [mpesa_stk, card]
        status:
          type: string
          enum: [pending, processing, succeeded, failed, canceled]
        mode:
          type: string
          enum: [test, live]
        reason:
          type: string
          nullable: true
        provider_ref:
          type: string
          nullable: true
        failure_reason:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
